[project]
name = "local-rag"
version = "0.1.0"
description = "Local document question-answering system using Retrieval-Augmented Generation"
readme = "README.md"
authors = [
    { name = "Ali Mehdi", email = "am4236428@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai",
    "chromadb",
    "langchain-text-splitters",
    "pypdf",
]

[project.scripts]
local-rag = "local_rag:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"